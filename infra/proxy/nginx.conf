events {
    worker_connections 1024;
}

http {
    upstream agent4 {
        server agent4-decision:8004;
    }

    server {
        listen 80;
        server_name localhost;

        # Add generic headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Route API to Agent 4 (which is our main orchestrator)
        location /api/ {
            proxy_pass http://agent4;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # Block direct access to MCP streams from outside if desired (though Agent 4 might need to expose it to the frontend)
        location /mcp {
            proxy_pass http://agent4;
            proxy_set_header Host $host;
            proxy_set_header Connection "keep-alive";
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
