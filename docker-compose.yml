# =========================================================
# Brings up: Postgres + all 4 agents + frontend, together.
# Run with:  docker-compose up --build
# =========================================================
version: "3.9"

services:


  agent1-intake:
    build: ./services/agent1-intake
    container_name: agent1_intake
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./shared:/shared
      - ./services/agent1-intake:/app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent2-rootcause:
    build: ./services/agent2-rootcause
    container_name: agent2_rootcause
    env_file: .env
    ports:
      - "8002:8002"
    volumes:
      - ./shared:/shared
      - ./services/agent2-rootcause:/app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent3-retrieval:
    build: ./services/agent3-retrieval
    container_name: agent3_retrieval
    env_file: .env
    ports:
      - "8003:8003"
    volumes:
      - ./shared:/shared
      - ./services/agent3-retrieval:/app
      - ./ir_system:/ir_system
      - vector_store:/data/chroma_db

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent4-decision:
    build: ./services/agent4-decision
    container_name: agent4_decision
    env_file: .env
    ports:
      - "8004:8004"
    volumes:
      - ./shared:/shared
      - ./services/agent4-decision:/app
    depends_on:
      agent1-intake:
        condition: service_healthy
      agent2-rootcause:
        condition: service_healthy
      agent3-retrieval:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: retail_frontend
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - agent4-decision

  reverse-proxy:
    image: nginx:alpine
    container_name: retail_proxy
    profiles:
      - demo
    ports:
      - "80:80"
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent4-decision

volumes:

  vector_store:

