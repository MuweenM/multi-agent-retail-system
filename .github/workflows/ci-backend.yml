name: Backend CI

on:
  pull_request:
    paths:
      - "services/**"
      - "shared/**"
  push:
    branches: [main, dev]

jobs:
  test-agents:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [agent1-intake, agent2-rootcause, agent3-retrieval, agent4-decision]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared package
        run: pip install -e shared
      - name: Install agent dependencies
        working-directory: services/${{ matrix.agent }}
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: services/${{ matrix.agent }}
        run: pytest tests/ -v
